# Builds the self-contained SanPyCAD-2D bundles.
#
# PyInstaller cannot cross-compile -- a macOS app can only be built on
# macOS and a Windows one only on Windows -- so this runs the same
# packaging/build_bundle.py on one runner per target and collects the
# results. Push a v* tag and the finished bundles are attached to a
# GitHub release automatically; run it by hand from the Actions tab to
# get them as downloadable artifacts without cutting a release.

name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is Apple Silicon. An Intel build (macos-13) was
          # dropped from this matrix -- GitHub's free-tier account caps
          # concurrent macOS runners at 5 across the whole account, and
          # with three repos (SanPyCAD, SanPyCAD-Brep, SanPyCAD-2D) each
          # queuing two macOS jobs per release, builds were stalling in
          # the queue. Re-add a macos-13 entry here (mirroring the
          # arm64 one, with asset SanPyCAD-2D-mac-intel.zip) if Intel
          # Mac support is needed later.
          - os: macos-14
            label: macOS (Apple Silicon)
            asset: SanPyCAD-2D-mac-arm64.zip
          - os: windows-latest
            label: Windows (x64)
            asset: SanPyCAD-2D-win-x64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy sympy scikit-image pywebview pyperclip pyinstaller

      - name: Build bundle
        env:
          SANPYCAD2D_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: python packaging/build_bundle.py

      # An unsigned app will not launch at all on Apple Silicon, so give
      # it an ad-hoc signature. This is not Apple notarization -- the
      # first launch still shows the "unidentified developer" warning,
      # which the README explains how to get past.
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/SanPyCAD-2D.app
          codesign --verify --verbose dist/SanPyCAD-2D.app
          rm -f dist/SanPyCAD-2D-mac.zip
          ditto -c -k --sequesterRsrc --keepParent dist/SanPyCAD-2D.app dist/SanPyCAD-2D-mac.zip

      - name: Name the asset
        shell: bash
        run: |
          built=$(ls dist/SanPyCAD-2D-*.zip | head -1)
          mv "$built" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
